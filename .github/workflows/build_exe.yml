name: Build Windows exe

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build executable
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --name codesentry exe_entry.py
          Rename-Item dist\codesentry.exe codesentry-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: codesentry-windows
          path: dist/codesentry-windows.exe
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/codesentry-windows.exe --clobber
