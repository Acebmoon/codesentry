name: Build release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the files to (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build executable
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --name codesentry exe_entry.py
          Rename-Item dist\codesentry.exe codesentry-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: codesentry-windows
          path: dist/codesentry-windows.exe
      - name: Attach to release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" dist/codesentry-windows.exe --clobber

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build binary
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --name codesentry exe_entry.py
          ./dist/codesentry --version
      - name: Build .deb
        run: |
          VERSION=$(python -c "import codesentry; print(codesentry.__version__)")
          PKG="codesentry_${VERSION}_amd64"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin"
          install -m 0755 dist/codesentry "$PKG/usr/bin/codesentry"
          cat > "$PKG/DEBIAN/control" <<CTRL
          Package: codesentry
          Version: ${VERSION}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: Acebmoon <Acebmoon@users.noreply.github.com>
          Homepage: https://github.com/Acebmoon/codesentry
          Description: Static scanner for hardcoded secrets and vulnerabilities
           Scans source code for leaked secrets and common vulnerabilities,
           checks dependencies against OSV.dev and the git history.
          CTRL
          sed -i 's/^          //' "$PKG/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$PKG"
          dpkg-deb --info "$PKG.deb"
      - name: Build .rpm (Fedora) and .pkg.tar.zst (Arch)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools zstd ruby
          sudo gem install fpm --no-document
          VERSION=$(python -c "import codesentry; print(codesentry.__version__)")
          mkdir -p root/usr/bin
          install -m 0755 dist/codesentry root/usr/bin/codesentry
          COMMON=(-s dir -n codesentry -v "$VERSION" --iteration 1 -a x86_64
            --description "Static scanner for hardcoded secrets and vulnerabilities"
            --url https://github.com/Acebmoon/codesentry --license MIT
            --maintainer "Acebmoon <Acebmoon@users.noreply.github.com>")
          fpm "${COMMON[@]}" -t rpm -p "codesentry-${VERSION}-1.x86_64.rpm" -C root usr/bin/codesentry
          fpm "${COMMON[@]}" -t pacman --pacman-compression zstd -p "codesentry-${VERSION}-1-x86_64.pkg.tar.zst" -C root usr/bin/codesentry
          ls -la *.rpm *.pkg.tar.zst
          rpm -qpi codesentry-*.rpm
          zstd -dc codesentry-*.pkg.tar.zst | tar -t
      - uses: actions/upload-artifact@v4
        with:
          name: codesentry-linux
          path: |
            *.deb
            *.rpm
            *.pkg.tar.zst
      - name: Attach to release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" *.deb *.rpm *.pkg.tar.zst --clobber

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            name: macos-arm64
          - runner: macos-15-intel
            name: macos-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build binary
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --name codesentry exe_entry.py
          ./dist/codesentry --version
          file dist/codesentry
      - name: Package
        run: |
          tar -czf codesentry-${{ matrix.name }}.tar.gz -C dist codesentry
      - uses: actions/upload-artifact@v4
        with:
          name: codesentry-${{ matrix.name }}
          path: codesentry-${{ matrix.name }}.tar.gz
      - name: Attach to release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" codesentry-${{ matrix.name }}.tar.gz --clobber
