[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codesentry"
version = "0.6.0"
description = "Fast static scanner for hardcoded secrets and common vulnerabilities in source code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["security", "secrets", "sast", "static-analysis", "devsecops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
codesentry = "codesentry.cli_main:main"

[tool.setuptools]
packages = ["codesentry"]
